name: Temporary guided-builder test reconciliation

on:
  push:
    branches:
      - review-transfer/weapon-mastery-audit

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconcile stale guided-builder tests
        shell: python
        run: |
          from pathlib import Path

          sheet_model = Path("src/CharacterSheet.Web/Client/test/sheet-model.test.mjs")
          text = sheet_model.read_text()
          old = '''        [
            ["species", "incomplete"],
            ["advancement", "incomplete"],
            ["abilities", "incomplete"],
            ["review", "available"]
        ]
    );
    assert.match(states.find(section => section.id === "advancement").detail, /No Starting Class/);
    assert.doesNotMatch(states.find(section => section.id === "advancement").detail, /Subclass.*required/i);'''
          new = '''        [
            ["class", "incomplete"],
            ["background", "incomplete"],
            ["species", "incomplete"],
            ["abilities", "incomplete"],
            ["review", "available"]
        ]
    );
    assert.match(states.find(section => section.id === "class").detail, /No Starting Class/);
    assert.doesNotMatch(states.find(section => section.id === "class").detail, /Subclass.*required/i);'''
          if old not in text:
              raise SystemExit("sheet-model stale expectation block not found")
          sheet_model.write_text(text.replace(old, new, 1))

          workspace = Path("src/CharacterSheet.Web/Client/test/workspace-mechanics.test.mjs")
          text = workspace.read_text()
          old = 'const openGuided = { open: true, activeSection: "advancement", returnSheetMode: "view" };'
          new = 'const openGuided = { open: true, activeSection: "class", returnSheetMode: "view" };'
          if old not in text:
              raise SystemExit("workspace stale guided section fixture not found")
          workspace.write_text(text.replace(old, new, 1))

          Path(".github/workflows/zz-temp-guided-builder-test-reconcile.yml").unlink()
      - name: Commit reconciled tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refresh guided builder test expectations"
          git push origin HEAD:review-transfer/weapon-mastery-audit
