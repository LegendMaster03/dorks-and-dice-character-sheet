# Isolated Workstream B validation; shared package.json and main CI remain unchanged.
# Remove this branch-scoped workflow after A registers the tests in the common suite.
name: Validate conventional Origin workspace
on:
  push:
    branches: ["feature/guided-creator-conventional-origin-20261126"]
permissions:
  contents: read
jobs:
  conventional:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/CharacterSheet.Web/Client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
      - run: npm install --no-audit --no-fund
      - name: Compile the adapter and run focused tests
        run: |
          npx tsc --ignoreConfig src/features/origin/conventional/workspace.ts --strict --outDir .test-dist --module ESNext --target ES2022 --moduleResolution Bundler --lib ES2022,DOM,DOM.Iterable --skipLibCheck
          node --test test/conventional-origin.test.mjs
