name: Validate Character Sheet

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "**" ]

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build frontend
        working-directory: src/CharacterSheet.Web/Client
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Enforce Embedded Module v2 lifecycle
        run: |
          if grep -R "MutationObserver" -n src/CharacterSheet.Web/Client/src; then
            echo "Application-owned frontend code must not use MutationObserver as a render lifecycle."
            exit 1
          fi

      - name: Restore
        run: dotnet restore dorks-and-dice-character-sheet.slnx

      - name: Test
        run: dotnet test dorks-and-dice-character-sheet.slnx --configuration Release --no-restore -p:BuildClient=false

      - name: Build container
        run: docker build -t dorks-and-dice-character-sheet:test -f src/CharacterSheet.Web/Dockerfile .
