name: Deploy Character Sheet
run-name: Deploy ${{ github.event.workflow_run.head_branch || github.ref_name }} at ${{ github.event.workflow_run.head_sha || github.sha }}

on:
  workflow_run:
    workflows: [ "Validate Character Sheet" ]
    types: [ completed ]
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: dorks-and-dice-character-sheet
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref_name == 'main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: [self-hosted, dorks-and-dice-character-sheet]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Build image
        timeout-minutes: 10
        run: docker build -t dorks-and-dice-character-sheet:latest -f src/CharacterSheet.Web/Dockerfile .

      - name: Start smoke-test PostgreSQL
        timeout-minutes: 2
        run: |
          docker rm -f dorks-and-dice-character-sheet-test-postgres 2>/dev/null || true
          docker network create dorks-and-dice-character-sheet-test 2>/dev/null || true
          docker run -d --name dorks-and-dice-character-sheet-test-postgres \
            --network dorks-and-dice-character-sheet-test \
            -e POSTGRES_DB=character_sheet_test \
            -e POSTGRES_USER=character_sheet_test \
            -e POSTGRES_PASSWORD=character_sheet_test \
            postgres:18

          # Match Rules Core's deployment smoke convention: wait through the official image's
          # initialization handoff, then require several consecutive SQL queries to succeed.
          sleep 10
          consecutive=0
          for i in {1..30}; do
            result=$(docker exec dorks-and-dice-character-sheet-test-postgres \
              psql -v ON_ERROR_STOP=1 -U character_sheet_test -d character_sheet_test -tAc 'SELECT 1' \
              2>/dev/null || true)
            if [ "$(echo "$result" | tr -d '[:space:]')" = "1" ]; then
              consecutive=$((consecutive + 1))
              if [ "$consecutive" -ge 3 ]; then
                break
              fi
            else
              consecutive=0
            fi
            sleep 1
          done

          if [ "$consecutive" -lt 3 ]; then
            echo "Smoke-test PostgreSQL did not become stably query-ready."
            docker logs dorks-and-dice-character-sheet-test-postgres || true
            exit 1
          fi

      - name: Smoke test container
        timeout-minutes: 5
        run: |
          docker rm -f dorks-and-dice-character-sheet-smoketest 2>/dev/null || true
          docker run -d --name dorks-and-dice-character-sheet-smoketest \
            --network dorks-and-dice-character-sheet-test \
            -e 'ConnectionStrings__CharacterSheet=Host=dorks-and-dice-character-sheet-test-postgres;Port=5432;Database=character_sheet_test;Username=character_sheet_test;Password=character_sheet_test' \
            dorks-and-dice-character-sheet:latest

          ready=false
          for i in {1..30}; do
            if [ "$(docker inspect -f '{{.State.Running}}' dorks-and-dice-character-sheet-smoketest 2>/dev/null)" != "true" ]; then
              echo "Character Sheet smoke-test container exited before becoming ready."
              docker logs dorks-and-dice-character-sheet-smoketest || true
              exit 1
            fi

            health=$(docker run --rm \
              --network dorks-and-dice-character-sheet-test \
              curlimages/curl:8.12.1 \
              -fsS http://dorks-and-dice-character-sheet-smoketest:8080/health 2>/dev/null || true)
            readiness=$(docker run --rm \
              --network dorks-and-dice-character-sheet-test \
              curlimages/curl:8.12.1 \
              -fsS http://dorks-and-dice-character-sheet-smoketest:8080/ready 2>/dev/null || true)
            appjs=$(docker run --rm \
              --network dorks-and-dice-character-sheet-test \
              curlimages/curl:8.12.1 \
              -fsS http://dorks-and-dice-character-sheet-smoketest:8080/app.js 2>/dev/null || true)

            if [ "$health" = "Healthy" ] \
              && echo "$readiness" | grep -q '"status":"ready"' \
              && echo "$readiness" | grep -q '"persistence":"postgresql-ready"' \
              && echo "$readiness" | grep -q '"characterAuthorization":"tool-host-owner-projection"' \
              && echo "$appjs" | grep -q 'Character Sheet'; then
              ready=true
              break
            fi
            sleep 1
          done

          if [ "$ready" != "true" ]; then
            echo "Character Sheet smoke test failed."
            docker logs dorks-and-dice-character-sheet-smoketest || true
            exit 1
          fi

      - name: Cleanup smoke-test infrastructure
        if: always()
        timeout-minutes: 3
        run: |
          docker rm -f dorks-and-dice-character-sheet-smoketest 2>/dev/null || true
          docker rm -f dorks-and-dice-character-sheet-test-postgres 2>/dev/null || true
          docker network rm dorks-and-dice-character-sheet-test 2>/dev/null || true

      - name: Deploy
        timeout-minutes: 5
        run: |
          ENV_FILE=/mnt/HDDs/www/dorks-and-dice-character-sheet/.env
          if [ ! -f "$ENV_FILE" ]; then
            echo "Character Sheet deployment configuration is missing: $ENV_FILE"
            exit 1
          fi

          docker compose \
            --project-name dorks-and-dice-character-sheet \
            --env-file "$ENV_FILE" \
            -f docker-compose.yml \
            config >/dev/null

          docker rm -f dorks-and-dice-character-sheet 2>/dev/null || true

          docker compose \
            --project-name dorks-and-dice-character-sheet \
            --env-file "$ENV_FILE" \
            -f docker-compose.yml \
            up -d --force-recreate --remove-orphans

      - name: Verify deployed service
        timeout-minutes: 5
        run: |
          ready=false
          for i in {1..60}; do
            health=$(docker run --rm \
              --network dorks-and-dice-backend \
              curlimages/curl:8.12.1 \
              -fsS http://dorks-and-dice-character-sheet:8080/health 2>/dev/null || true)
            readiness=$(docker run --rm \
              --network dorks-and-dice-backend \
              curlimages/curl:8.12.1 \
              -fsS http://dorks-and-dice-character-sheet:8080/ready 2>/dev/null || true)
            appjs=$(docker run --rm \
              --network dorks-and-dice-backend \
              curlimages/curl:8.12.1 \
              -fsS http://dorks-and-dice-character-sheet:8080/app.js 2>/dev/null || true)

            if [ "$health" = "Healthy" ] \
              && echo "$readiness" | grep -q '"status":"ready"' \
              && echo "$readiness" | grep -q '"persistence":"postgresql-ready"' \
              && echo "$readiness" | grep -q '"characterAuthorization":"tool-host-owner-projection"' \
              && echo "$appjs" | grep -q 'Character Sheet'; then
              echo "$readiness"
              ready=true
              break
            fi
            sleep 1
          done

          if [ "$ready" != "true" ]; then
            echo "Deployed Character Sheet did not become ready."
            docker logs dorks-and-dice-character-sheet || true
            exit 1
          fi
