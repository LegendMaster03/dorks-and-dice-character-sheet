services:
  character-sheet:
    image: dorks-and-dice-character-sheet:latest
    container_name: dorks-and-dice-character-sheet
    restart: unless-stopped
    environment:
      ToolHost__BaseUrl: "http://dorks-and-dice-site:8080"
      ConnectionStrings__CharacterSheet: "Data Source=/data/character-sheet.db"
    volumes:
      - character-sheet-data:/data
    networks:
      - dorks-and-dice-backend

volumes:
  character-sheet-data:
    name: dorks-and-dice-character-sheet-data

networks:
  dorks-and-dice-backend:
    external: true
