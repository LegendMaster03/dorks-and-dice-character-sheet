services:
  character-sheet:
    image: dorks-and-dice-character-sheet:latest
    container_name: dorks-and-dice-character-sheet
    restart: unless-stopped
    environment:
      ConnectionStrings__CharacterSheet: "${ConnectionStrings__CharacterSheet:?ConnectionStrings__CharacterSheet must be configured}"
      ToolHost__BaseUrl: "http://dorks-and-dice-site:8080"
    networks:
      - dorks-and-dice-backend

networks:
  dorks-and-dice-backend:
    external: true
